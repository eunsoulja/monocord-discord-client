[package]
name = "l-discord"
description = "Discord OAuth2, REST client, capabilities, and demo data for L"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
secrecy = "0.10"
tracing = "0.1"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
songbird = { version = "0.6", default-features = false, features = [
    "driver",
    "tungstenite",
    "rustls",
] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
