[package]
name = "l-widgets"
description = "Widget registry, layout engine, renderer, and built-in widgets for L"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
l-core = { path = "../l-core" }
l-ui = { path = "../l-ui" }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
fuzzy-matcher = "0.3"
lucide-icons = "1"
