[package]
name = "Monocord"
description = "Monocord — Discord client with plugin and theme support"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
directories = "6"
open = "5"
wry = "=0.57.3"
winit = "0.30"
